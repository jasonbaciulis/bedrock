---
variant: 'outline'
size: 'icon'
class: ''
---

<s:partial:components.ui.button
    as="button"
    :variant="view:variant"
    :size="view:size"
    class="{{ view:class }} absolute rounded-full"
    aria_label="Next slide"
    x_class="orientation === 'horizontal' ? 'top-1/2 -right-12 -translate-y-1/2' : '-bottom-12 left-1/2 -translate-x-1/2 rotate-90'"
    x_disabled="!canScrollNext"
    x_click="scrollNext()"
>
    <s:svg src="heroicons/outline/arrow-right" />
</s:partial:components.ui.button>
