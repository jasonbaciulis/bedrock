---
model: ''
min: 0
max: 9999
step: 1
show_input: true
container_class: 'flex flex-wrap items-center gap-x-6 gap-y-3'
class: ''
---

{{ once }}
    {{ push:scripts }}
        <s:vite src="resources/js/components/stepper.js" />
    {{ /push:scripts }}
{{ /once }}
<div
    {{ view:container_class | attribute:class }}
    x-data="Stepper({{ view:min }}, {{ view:max }}, {{ view:step }})"
>
    {{ unless slot }}
        <s:partial:components.ui.form.label :display="display" :id="id" />
    {{ /unless }}
    <div class="flex items-center gap-x-1">
        <s:partial:components.ui.button
            as="button"
            variant="outline"
            size="icon-sm"
            class="shrink-0 rounded-full"
            aria_label="Decrement"
            :aria_controls="id"
            x_click="decrement"
            x_disabled="isAtMin"
            tabindex="-1"
        >
            <s:svg src="heroicons/outline/minus" />
        </s:partial:components.ui.button>
        {{ if view:show_input }}
            <input
                x-ref="input"
                x-model="{{ view:model }}"
                x-modelable="count"
                id="{{ id }}"
                class="size-8 border-none px-0 text-center shadow-none [-moz-appearance:textfield] [&::-webkit-inner-spin-button]:m-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:m-0 [&::-webkit-outer-spin-button]:appearance-none"
                name="{{ handle }}"
                inputmode="numeric"
                type="number"
                :min="min"
                :max="max"
                :step="step"
                aria-labelledby="{{ id }}-label"
                :aria-invalid="form.invalid('{{ handle }}')"
                {{ partial:components.ui.form.aria-describedby }}
                @input="handleInput"
                @change="form.validate('{{ handle }}')"
            />
        {{ elseif slot }}
            <input type="hidden" name="{{ handle }}" value="{{ view:model }}" />
            <div class="{{ ['text-center', view:class] | classes | collapse_whitespace }}">
                <output
                    x-model="{{ view:model }}"
                    x-modelable="count"
                    id="{{ id }}"
                    aria-labelledby="{{ id }}-label"
                    class="tabular-nums"
                ></output>
                {{ slot }}
            </div>
        {{ /if }}
        <s:partial:components.ui.button
            as="button"
            variant="outline"
            size="icon-sm"
            class="shrink-0 rounded-full"
            aria_label="Increment"
            :aria_controls="id"
            x_click="increment"
            x_disabled="isAtMax"
            tabindex="-1"
        >
            <s:svg src="heroicons/outline/plus" />
        </s:partial:components.ui.button>
    </div>
</div>
<s:partial:components.ui.form.instructions :instructions="instructions" :id="id" />
