---
model: ''
max_files: 1
class: ''
---

<input
    x-model="{{ view:model }}"
    id="{{ id }}"
    type="file"
    name="{{ handle }}{{ view:max_files !== 1 ?= '[]' }}"
    {{ view:class | attribute:class }}
    {{ view:max_files !== 1 ?= 'multiple' }}
    :aria-invalid="form.invalid('{{ handle }}')"
    {{ partial:components.ui.form.aria-describedby }}
    @change="form.validate('{{ handle }}')"
/>
