---
model: ''
class: ''
---

<fieldset
    id="{{ id }}"
    {{ view:class | attribute:class }}
    :aria-invalid="form.invalid('{{ handle }}')"
    {{ partial:components.ui.form.aria-describedby }}
>
    <legend class="text-foreground block text-sm font-medium select-none">{{ display }}</legend>
    <s:partial:components.ui.form.instructions :instructions="instructions" :id="id" />
    <div class="mt-3 space-y-4">
        {{ foreach:options as="option|label" }}
            <div class="flex items-center gap-3">
                <input
                    x-model="{{ view:model }}"
                    id="{{ id }}-{{ option | slugify }}-option"
                    type="radio"
                    name="{{ handle }}"
                    value="{{ option }}"
                    :aria-invalid="form.invalid('{{ handle }}')"
                    @change="form.validate('{{ handle }}')"
                />
                <label for="{{ id }}-{{ option | slugify }}-option" class="font-normal">
                    {{ label }}
                </label>
            </div>
        {{ /foreach:options }}
    </div>
</fieldset>
