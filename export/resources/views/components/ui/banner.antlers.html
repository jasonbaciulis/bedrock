{{# Configure Banner inside Control Panel in /cp/globals/banner #}}
<div
    x-cloak
    x-show="visible"
    x-data="{
        dismissedAt: $persist(null).as('{{ site:name | snake }}_banner_dismissed_at'),
        dismissDurationInMilliseconds: {{ banner:dismiss_duration }} * 24 * 60 * 60 * 1000,
        get visible() {
            return this.dismissedAt === null || Date.now() - this.dismissedAt > this.dismissDurationInMilliseconds
        },
        dismiss() {
            this.dismissedAt = Date.now()
        },
    }"
    class="bg-foreground flex items-center gap-x-6 px-6 py-2.5 sm:px-3.5 sm:before:flex-1"
>
    <div class="text-sm/6 text-white">
        <a href="{{ banner:link_url }}">{{ banner:text }}</a>
    </div>
    <div class="flex flex-1 justify-end">
        <button
            type="button"
            class="btn -m-2 p-2 hover:opacity-80"
            @click="dismiss()"
            aria-label="Dismiss"
        >
            <s:svg src="lucide/x" class="text-white" />
        </button>
    </div>
</div>
