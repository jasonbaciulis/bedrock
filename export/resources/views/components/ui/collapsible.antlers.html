---
class: ''
trigger_class: ''
content_class: ''
---

<div
    x-data="{
        open: false,
        toggle() {
            this.open = !this.open
        },
        close() {
            this.open = false
        },
    }"
    x-id="['collapsible']"
    class="{{ ['relative', view:class] | classes | collapse_whitespace }}"
>
    <dt>
        <button
            type="button"
            :aria-controls="$id('collapsible')"
            :aria-expanded="open"
            @click="toggle()"
            @keydown.enter.prevent="toggle()"
            @keydown.space.prevent="toggle()"
            @keydown.escape="close()"
            {{ view:trigger_class | attribute:class }}
        >
            {{ slot:trigger }}
        </button>
    </dt>
    <dd
        x-cloak
        x-show="open"
        x-collapse
        :id="$id('collapsible')"
        role="region"
        :aria-hidden="!open"
        class="{{ ['relative', view:content_class] | classes | collapse_whitespace }}"
    >
        {{ slot:content }}
    </dd>
</div>
