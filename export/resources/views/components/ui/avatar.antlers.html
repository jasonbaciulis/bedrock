---
image: ''
w: ''
h: ''
name: ''
class: ''
---

<div
    class="{{ ['bg-primary-foreground shrink-0 overflow-hidden rounded-full', view:class] | classes | collapse_whitespace }}"
>
    <s:glide :src="view:image" :width="view:w" :height="view:h" dpr="2" fit="crop_focal">
        <img src="{{ url }}" alt="{{ view:name }}’s avatar" loading="lazy" />
    </s:glide>
</div>
