<figure class="not-prose my-0">
    <s:partial:components.ui.video.create
        :video="video"
        :file="video_file"
        :thumbnail="thumbnail"
        :ratio="aspect_ratio"
        :title="caption"
    />
    {{ if caption }}
        <figcaption class="text-muted-foreground mt-2 block text-sm">{{ caption }}</figcaption>
    {{ /if }}
</figure>
