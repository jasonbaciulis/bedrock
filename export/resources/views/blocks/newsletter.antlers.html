{{#
    Configure newsletter content inside Control Panel in /cp/globals/newsletter. Connect an email
    service provider inside app/Http/Controllers/SubscribeNewsletterController.php
#}}

{{ once }}
    {{ push:scripts }}
        <s:vite src="resources/js/components/newsletter.js" />
    {{ /push:scripts }}
{{ /once }}
{{ newsletter_id = {block_id} }}
<section
    id="{{ newsletter_id }}"
    x-cloak
    x-show="!isSubscribed"
    x-data="Newsletter({
                form: $form('post', '/newsletter', {
                    email: '',
                    honeypot: '',
                }),
                persistKey: '{{ site:name | snake }}_newsletter_subscribed',
                fallbackErrorMessage: {{ newsletter:error_message | macro('to_js') }},
            })"
    class="m-section"
>
    <div class="container">
        <s:partial:components.section-header
            :title="newsletter:title"
            :text="newsletter:text"
            :heading_level="first ? 'h1' : 'h2'"
            margin_class="mb-10"
        />

        <form
            x-ref="form"
            x-show="!success"
            @submit.prevent="submit()"
            class="mx-auto grid max-w-md gap-2"
        >
            <div class="flex flex-col gap-3 md:flex-row">
                <s:partial:components.ui.form.honeypot
                    model="form.honeypot"
                    handle="fax_number"
                    :form_handle="newsletter_id"
                />
                <input type="hidden" name="_token" value="{{ csrf_token }}" />

                <s:partial:components.ui.form.label
                    id="{newsletter_id}-email"
                    display="Email"
                    hide_display="true"
                />
                <s:partial:components.ui.form.fields.text
                    id="{newsletter_id}-email"
                    model="form.email"
                    handle="email"
                    input_type="email"
                    autocomplete="email"
                    :placeholder="newsletter:input_placeholder"
                />

                <s:partial:components.ui.button
                    class="shrink-0 sm:w-auto"
                    type="submit"
                    as="button"
                    :label="newsletter:button_label"
                />
            </div>

            <s:partial:components.ui.form.error handle="email" id="{newsletter_id}-email" />
        </form>

        <template x-if="success">
            <s:partial:components.ui.alert
                variant="success"
                role="alert"
                class="mx-auto mt-10 max-w-md"
                :title="newsletter:success_message"
            />
        </template>

        <template x-if="error && !form.hasErrors">
            <s:partial:components.ui.alert
                variant="error"
                role="alert"
                class="mx-auto mt-6 max-w-md"
            >
                <span x-text="errorMessage"></span>
            </s:partial:components.ui.alert>
        </template>
    </div>
</section>
