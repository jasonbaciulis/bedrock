<a
    href="{{ url }}"
    class="group hover:bg-accent relative -mx-2 flex items-center gap-x-4 rounded-lg p-2 transition-colors lg:m-0 lg:items-start lg:p-3"
    {{ is_external ?= 'target="_blank"' }}
>
    {{ if icon }}
        <s:svg
            :src="icon"
            class="text-muted-foreground group-hover:text-primary size-6 transition-colors lg:mt-1"
        />
    {{ /if }}
    <div>
        <span class="text-foreground font-medium">
            {{ title }}
            {{ if is_external }}
                <s:partial:components.ui.new-tab-hint />
            {{ /if }}
        </span>
        {{ if badge }}
            <s:partial:components.ui.badge variant="outline" class="relative -top-px ml-1.5">
                {{ badge }}
            </s:partial:components.ui.badge>
        {{ /if }}
        {{ if description }}
            <p class="text-muted-foreground hidden text-pretty lg:block">{{ description }}</p>
        {{ /if }}
    </div>
</a>
