{{ if social_media:platforms | count > 0 }}
    <div class="flex gap-6">
        {{ social_media:platforms }}
            <a
                href="{{ prefix }}{{ url }}"
                class="text-muted-foreground hover:text-foreground"
                target="_blank"
            >
                <s:svg src="social/{type}" class="size-5" />
                <span class="sr-only">{{ config:app:name }} {{ type | title }}</span>
                <s:partial:components.ui.new-tab-hint />
            </a>
        {{ /social_media:platforms }}
    </div>
{{ /if }}
