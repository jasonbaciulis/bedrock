---
color: ''
---

<div class="relative flex">
    <div class="flex w-full items-center gap-x-3 md:block md:space-y-1.5">
        <div
            class="{{ view:color }} outline-foreground/10 size-24 rounded-sm outline -outline-offset-1 md:aspect-square md:h-auto md:w-full md:rounded-md"
        ></div>
        <div class="px-0.5">
            <div class="text-muted-foreground w-full font-mono text-xs">
                {{ view:color | replace('bg-', '') }}
            </div>
        </div>
    </div>
</div>
