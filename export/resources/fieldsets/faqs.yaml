title: FAQs
fields:
  -
    handle: title
    field:
      display: Title
      type: text
  -
    handle: text
    field: common.text_basic
    config:
      display: Text
      inline: true
      buttons:
        - bold
        - italic
        - anchor
  -
    handle: items
    field:
      collapse: true
      display: Items
      type: replicator
      if:
        block_type: 'equals collapsed'
      button_label: 'Add Item'
      sets:
        main:
          display: Main
          sets:
            item:
              display: Item
              hide: true
              fields:
                -
                  handle: title
                  field:
                    display: Title
                    type: text
                    validate:
                      - required
                -
                  handle: text
                  field: common.text_basic
                  config:
                    validate:
                      - required
                    buttons:
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - removeformat
                      - anchor
                    display: Text
