tabs:
  main:
    display: Main
    sections:
      -
        display: Banner
        instructions: 'Announce new product releases, rebranding, or any other important stuff that warrants prime real estate on your website.'
        fields:
          -
            handle: show
            field:
              display: Show
              type: toggle
              instructions: 'Displays banner sitewide at the very top of the page'
          -
            handle: dismissible
            field:
              type: toggle
              display: Dismissible
              instructions: 'Shows a close button. A dismissed banner stays hidden until the text changes.'
              if:
                show: 'equals true'
          -
            handle: text
            field: common.text_basic
            config:
              buttons:
                - bold
                - italic
                - underline
                - removeformat
                - anchor
              display: Text
              validate:
                - 'required_if:show,true'
              if:
                show: 'equals true'
              fullscreen: false
              inline: true
