tabs:
  main:
    display: Main
    sections:
      -
        display: Newsletter
        instructions: 'Configure email opt-in form that can be used inside the Newsletter block'
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              localizable: true
          -
            handle: text
            field: common.text_basic
            config:
              display: Text
              inline: true
              buttons:
                - bold
                - italic
                - anchor
          -
            handle: input_placeholder
            field:
              type: text
              display: 'Input placeholder'
              width: 50
              localizable: true
          -
            handle: button_label
            field:
              type: text
              display: 'Button label'
              width: 50
              localizable: true
          -
            handle: success_message
            field:
              type: text
              display: 'Success message'
              localizable: true
          -
            handle: error_message
            field:
              type: text
              display: 'Error message'
              instructions: 'Shown when the subscription fails and the server does not return a message, for example on a network error.'
              localizable: true
              validate:
                - required
