title: Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: image
            field: common.image
            config:
              validate:
                - required
          -
            handle: excerpt
            field: common.text_plain
            config:
              display: Excerpt
          -
            handle: show_related_posts
            field:
              display: 'Related posts'
              type: toggle
              width: 50
              default: true
          -
            import: article
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Categories
              mode: select
              max_items: 1
          -
            handle: featured
            field:
              display: Featured
              type: toggle
