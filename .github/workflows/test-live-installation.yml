name: Test Live Installation

on:
  # Run on releases to test the actual published starter kit
  release:
    types: [published]
  # Allow manual testing
  workflow_dispatch:
  # Run weekly to catch issues
  schedule:
    - cron: '0 2 * * 1'  # Monday at 2 AM

jobs:
  test-live-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Statamic CLI
        run: composer global require statamic/cli

      - name: Add Composer global bin to PATH
        run: echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Test live starter kit installation
        run: |
          # Create a test directory
          mkdir test-installation
          cd test-installation

          # Test the actual installation command that users will run
          echo "Testing: statamic new bedrock-test jasonbaciulis/bedrock"

          # Use --no-interaction to avoid CLI prompts
          statamic new bedrock-test jasonbaciulis/bedrock --no-interaction

          echo "✓ Starter kit installation completed"

      - name: Run deferred post-install hook
        run: |
          cd test-installation/bedrock-test

          # Statamic skips the post-install hook when the environment has no TTY.
          # The hook installs the dev dependencies, thus CI must run it.
          if [ -f storage/statamic/tmp/cli/post-install-instructions.txt ]; then
            echo "TTY not supported during install. Running the post-install hook now."
            php please starter-kit:run-post-install jasonbaciulis/bedrock --no-interaction
          else
            echo "✓ Post-install hook already ran during installation"
          fi

      - name: Verify dev dependencies
        run: |
          cd test-installation/bedrock-test

          REQUIRED_BINARIES=(
            "vendor/bin/pest"
            "vendor/bin/phpstan"
            "vendor/bin/rector"
          )

          for binary in "${REQUIRED_BINARIES[@]}"; do
            if [ -e "$binary" ]; then
              echo "✓ $binary exists"
            else
              echo "❌ $binary missing"
              exit 1
            fi
          done

          php vendor/bin/pest --version

      - name: Verify installation
        run: |
          cd test-installation/bedrock-test

          # Check that key files exist
          echo "Checking installed files..."

          REQUIRED_FILES=(
            "composer.json"
            "package.json"
            "vite.config.js"
            "artisan"
            "config/app.php"
            "resources/views"
            "content"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -e "$file" ]; then
              echo "✓ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

      - name: Run setup
        run: |
          cd test-installation/bedrock-test

          # Install all dependencies and build assets
          composer run setup --no-interaction

      - name: Install Playwright browsers
        run: |
          cd test-installation/bedrock-test

          bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          cd test-installation/bedrock-test

          composer test:browser

      - name: Store browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: test-installation/bedrock-test/tests/Browser/Screenshots

      - name: Test post-install script
        run: |
          cd test-installation/bedrock-test

          # Check if post-install script was executed
          # The script should have prompted about starring the repo
          echo "✓ Installation process completed successfully"

          # Verify starter kit specific files
          if [ -f "StarterKitPostInstall.php" ]; then
            echo "⚠️  Warning: StarterKitPostInstall.php should not be in the final installation"
          fi

      - name: Summary
        run: |
          echo ""
          echo "🎉 Live installation test completed successfully!"
          echo ""
          echo "Tested command: statamic new bedrock-test jasonbaciulis/bedrock"
          echo ""
          echo "✅ Installation works correctly"
          echo "✅ Dependencies install properly"
          echo "✅ Assets build successfully"
          echo "✅ Homepage passes the browser smoke test"
