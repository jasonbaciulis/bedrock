name: Test Installation

on:
  # Install the kit of the pull request, before it is released
  pull_request:
    branches: [main]
  # Install the published kit, as users do
  release:
    types: [published]
  workflow_dispatch:
  # Catch problems from new versions of the dependencies
  schedule:
    - cron: '0 2 * * 1'  # Monday at 2 AM

concurrency:
  group: test-installation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Statamic CLI
        run: composer global require statamic/cli

      - name: Add Composer global bin to PATH
        run: echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Checkout the kit of the pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          path: kit

      # `statamic new --local` installs the kit from this path repository, not from Packagist.
      - name: Register the kit of the pull request as a local repository
        if: github.event_name == 'pull_request'
        run: composer config --global repositories.bedrock path "$GITHUB_WORKSPACE/kit"

      - name: Install the starter kit
        run: |
          mkdir test-installation
          cd test-installation

          statamic new bedrock-test jasonbaciulis/bedrock --no-interaction ${{ github.event_name == 'pull_request' && '--local' || '' }}

      - name: Run deferred post-install hook
        run: |
          cd test-installation/bedrock-test

          # Statamic skips the post-install hook when the environment has no TTY.
          # The hook installs the dev dependencies, thus CI must run it.
          if [ -f storage/statamic/tmp/cli/post-install-instructions.txt ]; then
            echo "TTY not supported during install. Running the post-install hook now."
            php please starter-kit:run-post-install jasonbaciulis/bedrock --no-interaction
          else
            echo "✓ Post-install hook already ran during installation"
          fi

      - name: Verify dev dependencies
        run: |
          cd test-installation/bedrock-test

          REQUIRED_BINARIES=(
            "vendor/bin/pest"
            "vendor/bin/phpstan"
            "vendor/bin/rector"
          )

          for binary in "${REQUIRED_BINARIES[@]}"; do
            if [ -e "$binary" ]; then
              echo "✓ $binary exists"
            else
              echo "❌ $binary missing"
              exit 1
            fi
          done

          php vendor/bin/pest --version

      - name: Verify installation
        run: |
          cd test-installation/bedrock-test

          # Check that key files exist
          echo "Checking installed files..."

          REQUIRED_FILES=(
            "composer.json"
            "package.json"
            "vite.config.js"
            "artisan"
            "config/app.php"
            "resources/views"
            "content"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -e "$file" ]; then
              echo "✓ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

      - name: Run setup
        run: |
          cd test-installation/bedrock-test

          # Install all dependencies and build assets
          composer run setup --no-interaction

      - name: Check control panel loads
        run: |
          cd test-installation/bedrock-test

          # Statamic logs Composer's stderr from the install as errors, so only check what's logged from here on
          log=storage/logs/laravel.log
          offset=$(stat -c %s "$log" 2>/dev/null || echo 0)

          php artisan serve --port=8000 > /dev/null 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 1; done'

          # Follows the redirect to the login screen and fails on a 4xx/5xx
          curl -fsSL -o /dev/null -w '%{http_code} %{url_effective}\n' http://127.0.0.1:8000/cp

          if [ -f "$log" ] && tail -c +$((offset + 1)) "$log" | grep -E '\.(EMERGENCY|ALERT|CRITICAL|ERROR):'; then
            echo "::error::PHP errors were logged"
            exit 1
          fi

      # Includes tests/Feature/EntriesTest.php, which renders every published page and the latest post.
      - name: Run unit and feature tests
        run: |
          cd test-installation/bedrock-test

          vendor/bin/pest --exclude-testsuite=Browser

      - name: Install Playwright browsers
        run: |
          cd test-installation/bedrock-test

          bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          cd test-installation/bedrock-test

          composer test:browser

      - name: Store browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: test-installation/bedrock-test/tests/Browser/Screenshots
